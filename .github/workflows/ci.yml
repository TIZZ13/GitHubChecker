name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntax check
        run: node --check assets/app.js

      - name: Tests
        run: node --test tests/

      - name: Local assets exist
        run: python3 scripts/check.py
